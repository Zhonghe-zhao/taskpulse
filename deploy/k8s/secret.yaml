apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: taskpulse
type: Opaque
stringData:
  MYSQL_USER: taskpulse
  MYSQL_PASSWORD: replace-this-development-password
  MYSQL_ROOT_PASSWORD: replace-this-development-root-password
  TASKPULSE_WORKER_AUTH_TOKEN: replace-this-development-worker-token
