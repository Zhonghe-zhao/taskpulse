apiVersion: v1
kind: ConfigMap
metadata:
  name: taskpulse-config
  namespace: taskpulse
data:
  TASKPULSE_STORAGE: mysql
  TASKPULSE_HTTP_ADDR: :8080
  TASKPULSE_INTERNAL_WORKERS_ENABLED: "false"
  MYSQL_HOST: mysql.taskpulse.svc.cluster.local
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: taskpulse
  MYSQL_CONNECT_TIMEOUT: 5s
  MYSQL_READ_TIMEOUT: 10s
  MYSQL_WRITE_TIMEOUT: 10s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: taskpulse
data:
  000001_init.sql: |
    CREATE TABLE tasks (
        id VARCHAR(64) NOT NULL,
        workflow VARCHAR(64) NOT NULL,
        status VARCHAR(32) NOT NULL,
        input_json JSON NOT NULL,
        result_json JSON NULL,
        error_message TEXT NULL,
        progress TINYINT UNSIGNED NOT NULL DEFAULT 0,
        retry_count INT UNSIGNED NOT NULL DEFAULT 0,
        max_retries INT UNSIGNED NOT NULL DEFAULT 0,
        available_at DATETIME(6) NOT NULL,
        lease_owner VARCHAR(128) NULL,
        lease_expires_at DATETIME(6) NULL,
        idempotency_key VARCHAR(128) NULL,
        version BIGINT UNSIGNED NOT NULL DEFAULT 0,
        created_at DATETIME(6) NOT NULL,
        updated_at DATETIME(6) NOT NULL,
        started_at DATETIME(6) NULL,
        finished_at DATETIME(6) NULL,
        PRIMARY KEY (id),
        UNIQUE KEY uk_tasks_idempotency_key (idempotency_key),
        KEY idx_tasks_claim (status, available_at, created_at, id),
        KEY idx_tasks_expired_lease (status, lease_expires_at),
        CONSTRAINT chk_tasks_progress CHECK (progress <= 100),
        CONSTRAINT chk_tasks_retry_count CHECK (retry_count <= max_retries)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;
    CREATE TABLE task_events (
        id VARCHAR(64) NOT NULL,
        task_id VARCHAR(64) NOT NULL,
        type VARCHAR(64) NOT NULL,
        message TEXT NOT NULL,
        payload_json JSON NULL,
        progress TINYINT UNSIGNED NOT NULL DEFAULT 0,
        created_at DATETIME(6) NOT NULL,
        PRIMARY KEY (id),
        KEY idx_task_events_task_time (task_id, created_at, id),
        CONSTRAINT fk_task_events_task FOREIGN KEY (task_id) REFERENCES tasks(id) ON DELETE CASCADE,
        CONSTRAINT chk_task_events_progress CHECK (progress <= 100)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;
  000002_binary_idempotency_key.sql: |
    ALTER TABLE tasks MODIFY idempotency_key VARBINARY(128) NULL;
  000003_workflow_idempotency.sql: |
    ALTER TABLE tasks
        DROP INDEX uk_tasks_idempotency_key,
        ADD UNIQUE KEY uk_tasks_workflow_idempotency (workflow, idempotency_key);
  000004_task_outbox.sql: |
    CREATE TABLE task_outbox (
        id VARCHAR(128) NOT NULL,
        task_id VARCHAR(64) NOT NULL,
        workflow VARCHAR(64) NOT NULL,
        event_type VARCHAR(64) NOT NULL,
        payload_json JSON NOT NULL,
        status VARCHAR(32) NOT NULL DEFAULT 'pending',
        attempts INT UNSIGNED NOT NULL DEFAULT 0,
        available_at DATETIME(6) NOT NULL,
        published_at DATETIME(6) NULL,
        last_error TEXT NULL,
        created_at DATETIME(6) NOT NULL,
        updated_at DATETIME(6) NOT NULL,
        PRIMARY KEY (id),
        KEY idx_task_outbox_pending (status, available_at, created_at, id),
        KEY idx_task_outbox_task (task_id),
        CONSTRAINT fk_task_outbox_task FOREIGN KEY (task_id) REFERENCES tasks(id) ON DELETE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;
  000005_task_list_indexes.sql: |
    ALTER TABLE tasks
        ADD KEY idx_tasks_list_created (created_at, id),
        ADD KEY idx_tasks_list_status_created (status, created_at, id),
        ADD KEY idx_tasks_list_workflow_created (workflow, created_at, id);
  000006_task_last_heartbeat.sql: |
    ALTER TABLE tasks
        ADD COLUMN last_heartbeat_at DATETIME(6) NULL AFTER lease_expires_at;
