name: taskpulse

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskpulse}
      MYSQL_USER: ${MYSQL_USER:-taskpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskpulse_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-taskpulse_root_dev}
      TZ: UTC
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.sql:ro
      - ./migrations/000002_binary_idempotency_key.up.sql:/docker-entrypoint-initdb.d/000002_binary_idempotency_key.sql:ro
      - ./migrations/000003_workflow_idempotency.up.sql:/docker-entrypoint-initdb.d/000003_workflow_idempotency.sql:ro
      - ./migrations/000004_task_outbox.up.sql:/docker-entrypoint-initdb.d/000004_task_outbox.sql:ro
      - ./migrations/000005_task_list_indexes.up.sql:/docker-entrypoint-initdb.d/000005_task_list_indexes.sql:ro
      - ./migrations/000006_task_last_heartbeat.up.sql:/docker-entrypoint-initdb.d/000006_task_last_heartbeat.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  taskpulse:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: taskpulse
    environment:
      TASKPULSE_STORAGE: mysql
      TASKPULSE_HTTP_ADDR: :8080
      TASKPULSE_INTERNAL_WORKERS_ENABLED: "false"
      TASKPULSE_WORKER_AUTH_TOKEN: ${TASKPULSE_WORKER_AUTH_TOKEN:-taskpulse_dev_worker_token}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskpulse}
      MYSQL_USER: ${MYSQL_USER:-taskpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskpulse_dev}
      MYSQL_CONNECT_TIMEOUT: 5s
      MYSQL_READ_TIMEOUT: 10s
      MYSQL_WRITE_TIMEOUT: 10s
    ports:
      - "${TASKPULSE_BIND_ADDRESS:-127.0.0.1}:${TASKPULSE_HTTP_PORT:-8085}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/metrics >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  llm-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: llm-worker
    environment:
      TASKPULSE_URL: http://taskpulse:8080
      TASKPULSE_WORKER_AUTH_TOKEN: ${TASKPULSE_WORKER_AUTH_TOKEN:-taskpulse_dev_worker_token}
      # Leave empty by default so every scaled container derives a unique ID from its hostname.
      TASKPULSE_EXTERNAL_WORKER_ID: ${TASKPULSE_EXTERNAL_WORKER_ID:-}
      TASKPULSE_EXTERNAL_LEASE: 30s
      TASKPULSE_EXTERNAL_POLL_INTERVAL: ${TASKPULSE_EXTERNAL_POLL_INTERVAL:-200ms}
      TASKPULSE_EXTERNAL_CLAIM_RETRY_MAX_INTERVAL: ${TASKPULSE_EXTERNAL_CLAIM_RETRY_MAX_INTERVAL:-5s}
      TASKPULSE_EXTERNAL_EXECUTION_TIMEOUT: ${TASKPULSE_EXTERNAL_EXECUTION_TIMEOUT:-}
      TASKPULSE_EXTERNAL_SHUTDOWN_TIMEOUT: ${TASKPULSE_EXTERNAL_SHUTDOWN_TIMEOUT:-5s}
      TASKPULSE_LLM_FAKE_FAILURE: ${TASKPULSE_LLM_FAKE_FAILURE:-}
      TASKPULSE_LLM_FAKE_DELAY: ${TASKPULSE_LLM_FAKE_DELAY:-}
    depends_on:
      taskpulse:
        condition: service_healthy

volumes:
  mysql_data:
