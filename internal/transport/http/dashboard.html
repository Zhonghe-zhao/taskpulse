<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskPulse Control</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0f1215;
      --header: #15191d;
      --panel: #1a1f24;
      --panel-strong: #22282e;
      --line: #2e353c;
      --line-soft: #252b31;
      --text: #e8eef4;
      --muted: #8b949e;
      --accent: #2bb8c8;
      --accent-strong: #1a9aab;
      --accent-soft: rgba(43, 184, 200, 0.14);
      --good: #3ecf8e;
      --warn: #e6b84d;
      --bad: #ef6b73;
      --violet: #9b8af5;
      --shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(43,184,200,0.08), transparent 55%),
        radial-gradient(900px 420px at 90% 0%, rgba(62,207,142,0.05), transparent 50%),
        var(--page);
      color: var(--text);
      font: 14px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
    }
    button, input, select { font: inherit; }
    header {
      position: sticky; top: 0; z-index: 20;
      min-height: 60px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--header) 92%, transparent);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
    h1 span { color: var(--accent); }
    h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.01em; }
    main { max-width: 1480px; margin: 0 auto; padding: 22px 28px 56px; }
    .header-actions, .toolbar, .pagination, .section-heading { display: flex; align-items: center; gap: 10px; }
    .header-actions { justify-content: flex-end; flex-wrap: wrap; }
    .status-text, .muted { color: var(--muted); font-size: 12px; }
    .language { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .language button { min-width: 40px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--muted); padding: 6px 9px; }
    .language button:last-child { border-right: 0; }
    .language button.active { background: var(--panel-strong); color: var(--text); }
    .section-heading { justify-content: space-between; margin-bottom: 12px; gap: 12px; }
    .section-heading > div { display: flex; flex-direction: column; gap: 2px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .metric, .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .metric {
      min-height: 88px; padding: 13px 14px; text-align: left; color: var(--text); cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .12s ease;
    }
    .metric:hover { border-color: #4a5560; background: var(--panel-strong); }
    .metric.active {
      border-color: var(--accent);
      background: linear-gradient(180deg, var(--accent-soft), transparent 70%), var(--panel-strong);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 10px; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .tone-queued { color: var(--warn); }
    .tone-running { color: var(--accent); }
    .tone-succeeded { color: var(--good); }
    .tone-failed { color: var(--bad); }
    .tone-canceled { color: var(--muted); }
    .tone-partial { color: var(--violet); }
    .top-layout { display: grid; grid-template-columns: minmax(0, .88fr) minmax(380px, 1.12fr); gap: 14px; margin-bottom: 16px; }
    .panel { overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .panel-header {
      display: flex; gap: 12px; align-items: center; justify-content: space-between;
      min-height: 52px; padding: 12px 16px; border-bottom: 1px solid var(--line);
    }
    .signals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); }
    .signal { min-height: 78px; padding: 14px 16px; background: var(--panel); }
    .signal strong { display: block; margin-top: 7px; font-size: 18px; font-variant-numeric: tabular-nums; }
    .signal .hint { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    form.lookup { display: flex; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
    input, select {
      min-width: 0; border: 1px solid var(--line); background: #12161a; color: var(--text);
      border-radius: 6px; padding: 8px 10px; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    input { flex: 1; }
    button {
      border: 1px solid var(--accent-strong); background: var(--accent-strong); color: white;
      border-radius: 6px; padding: 8px 12px; font-weight: 650; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { border-color: var(--line); background: var(--panel-strong); color: var(--text); }
    button:disabled { cursor: not-allowed; opacity: .45; filter: none; }
    .detail, .empty { padding: 16px; }
    .empty { color: var(--muted); }
    .detail { overflow: auto; max-height: min(68vh, 760px); }
    .detail-sections { display: grid; gap: 14px; }
    .detail-section {
      border: 1px solid var(--line-soft); border-radius: 7px; background: #14181c; padding: 12px 14px;
    }
    .detail-section h3 {
      margin: 0 0 10px; font-size: 12px; font-weight: 650; color: var(--muted); text-transform: none; letter-spacing: 0.02em;
    }
    dl { display: grid; grid-template-columns: 108px 1fr; margin: 0; gap: 7px 12px; }
    dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .reference-fields {
      display: grid; gap: 1px; min-width: 0; overflow: hidden;
      border: 1px solid var(--line-soft); border-radius: 6px; background: var(--line-soft);
    }
    .reference-field {
      display: grid; grid-template-columns: minmax(120px, .42fr) minmax(0, 1fr); gap: 10px;
      padding: 7px 9px; background: #101418;
    }
    .reference-key, .reference-value {
      min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    }
    .reference-key { color: var(--muted); }
    .reference-value { color: var(--text); }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid currentColor; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 650;
    }
    .status-pill::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .9;
    }
    .progress-bar {
      display: inline-grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: center; min-width: 92px; max-width: 120px;
    }
    .progress-track {
      height: 6px; border-radius: 999px; background: #2a3138; overflow: hidden;
    }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); }
    .progress-fill.is-done { background: var(--good); }
    .progress-fill.is-failed { background: var(--bad); }
    .events-title { margin: 16px 0 10px; }
    .events { list-style: none; padding: 0; margin: 0; position: relative; }
    .events::before {
      content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line);
    }
    .events li {
      position: relative; padding: 0 0 14px 28px;
    }
    .events li:last-child { padding-bottom: 0; }
    .events li::before {
      content: ""; position: absolute; left: 2px; top: 5px; width: 12px; height: 12px;
      border-radius: 50%; border: 2px solid var(--accent); background: var(--panel);
    }
    .events li.is-good::before { border-color: var(--good); }
    .events li.is-bad::before { border-color: var(--bad); }
    .events li.is-warn::before { border-color: var(--warn); }
    .events li.is-muted::before { border-color: var(--muted); }
    .event-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .toolbar { flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .toolbar input { flex: 1 1 220px; }
    .toolbar select { flex: 0 1 180px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      padding: 11px 13px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: middle;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    th {
      position: sticky; top: 0; z-index: 1;
      color: var(--muted); background: #171b1f; font-size: 12px; font-weight: 600;
    }
    tbody tr { cursor: pointer; transition: background .12s ease; }
    tbody tr:hover { background: var(--panel-strong); }
    tbody tr.is-selected {
      background: linear-gradient(90deg, var(--accent-soft), transparent 42%);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .col-id { width: 23%; } .col-workflow { width: 18%; } .col-status { width: 12%; }
    .col-progress { width: 12%; } .col-retry { width: 9%; } .col-time { width: 15%; } .col-error { width: 11%; }
    .badge {
      display: inline-block; max-width: 100%; border: 1px solid currentColor; border-radius: 999px;
      padding: 2px 8px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; font-weight: 650;
    }
    .table-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      min-height: 54px; padding: 10px 16px; border-top: 1px solid var(--line-soft);
    }
    .pagination { justify-content: flex-end; }
    .auto-refresh { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .auto-refresh input { flex: none; accent-color: var(--accent); }
    .header-actions > button { padding: 6px 10px; }
    .scope {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 12px;
    }
    .scope-chip {
      border: 1px solid var(--line); background: var(--panel-strong); color: var(--text);
      border-radius: 999px; padding: 2px 8px; font-size: 11px;
    }
    .detail-actions { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
    button.danger { border-color: #be3945; background: #9f2f39; }
    details { margin-top: 4px; border: 1px solid var(--line); border-radius: 6px; background: #111417; }
    summary { cursor: pointer; padding: 10px 11px; color: var(--muted); }
    details pre { margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; max-height: 240px; overflow: auto; padding: 11px; color: #d1d5db; font-size: 12px; background: #0e1114; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (max-width: 980px) {
      header { padding: 10px 16px; flex-wrap: wrap; }
      main { padding: 18px 14px; }
      .top-layout { grid-template-columns: 1fr; }
      .header-actions { width: 100%; justify-content: space-between; }
      .col-error { display: none; }
      .col-id { width: 34%; } .col-workflow { width: 24%; }
      .detail { max-height: none; }
      .reference-field { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>TaskPulse</span> Control</h1>
    <div class="header-actions">
      <span id="refresh-status" class="status-text" data-i18n="loadingMetrics">正在读取指标...</span>
      <label class="auto-refresh"><input id="auto-refresh" type="checkbox" checked><span data-i18n="autoRefresh">自动刷新</span></label>
      <button id="refresh-all" type="button" class="secondary" data-i18n="refresh">刷新</button>
      <div class="language" role="group" aria-label="Language">
        <button id="lang-zh" type="button">中</button><button id="lang-en" type="button">EN</button>
      </div>
    </div>
  </header>
  <main>
    <div class="section-heading">
      <div>
        <h2 data-i18n="queueOverview">队列概览</h2>
        <span id="stats-scope" class="scope"></span>
      </div>
      <span class="muted" data-i18n="statusHint">点击状态卡筛选；再点一次取消</span>
    </div>
    <section class="metrics" aria-label="Current task status">
      <button class="metric" data-status="queued" type="button"><span class="label" data-i18n="queued">排队中</span><span id="queued" class="value tone-queued">-</span></button>
      <button class="metric" data-status="retrying" type="button"><span class="label" data-i18n="retrying">等待重试</span><span id="retrying" class="value tone-queued">-</span></button>
      <button class="metric" data-status="running" type="button"><span class="label" data-i18n="running">执行中</span><span id="running" class="value tone-running">-</span></button>
      <button class="metric" data-status="succeeded" type="button"><span class="label" data-i18n="succeeded">成功</span><span id="succeeded" class="value tone-succeeded">-</span></button>
      <button class="metric" data-status="partially_succeeded" type="button"><span class="label" data-i18n="partiallySucceeded">部分成功</span><span id="partially_succeeded" class="value tone-partial">-</span></button>
      <button class="metric" data-status="failed" type="button"><span class="label" data-i18n="failed">失败</span><span id="failed" class="value tone-failed">-</span></button>
      <button class="metric" data-status="canceled" type="button"><span class="label" data-i18n="canceled">已取消</span><span id="canceled" class="value tone-canceled">-</span></button>
    </section>

    <section class="top-layout">
      <div class="panel">
        <div class="panel-header">
          <h2 data-i18n="runtimeSignals">运行信号</h2>
          <span id="runtime-scope" class="muted">范围：全部 Workflow · 当前进程</span>
        </div>
        <div class="signals">
          <div class="signal"><span class="muted" data-i18n="oldestAvailable">最早可领取任务</span><strong id="oldest">-</strong></div>
          <div class="signal"><span class="muted" data-i18n="claimAttempts">领取尝试</span><strong id="attempts">-</strong></div>
          <div class="signal"><span class="muted" data-i18n="claimMisses">空领取</span><strong id="misses">-</strong><span id="miss-ratio" class="hint"></span></div>
          <div class="signal"><span class="muted" data-i18n="tasksClaimed">成功领取</span><strong id="claimed">-</strong></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2 data-i18n="inspectTask">任务详情</h2>
          <span class="muted" data-i18n="taskLookup">按任务 ID 查询，或点击下方列表</span>
        </div>
        <form id="task-form" class="lookup">
          <input id="task-id" class="mono" aria-label="Task ID" placeholder="task_..." required autocomplete="off" spellcheck="false">
          <button type="submit" data-i18n="inspect">查询</button>
        </form>
        <div id="task-detail" class="empty" data-i18n="inspectEmpty">输入任务 ID，查看状态和事件历史。</div>
      </div>
    </section>

    <section id="task-list" class="panel">
      <div class="panel-header">
        <h2 data-i18n="taskTimeline">任务列表</h2>
        <span id="list-status" class="muted"></span>
      </div>
      <div class="toolbar">
        <select id="status-filter" aria-label="Status">
          <option value="" data-i18n="allStatuses">全部状态</option>
          <option value="queued" data-i18n="queued">排队中</option>
          <option value="retrying" data-i18n="retrying">等待重试</option>
          <option value="running" data-i18n="running">执行中</option>
          <option value="succeeded" data-i18n="succeeded">成功</option>
          <option value="partially_succeeded" data-i18n="partiallySucceeded">部分成功</option>
          <option value="failed" data-i18n="failed">失败</option>
          <option value="canceled" data-i18n="canceled">已取消</option>
        </select>
        <input id="workflow-filter" data-i18n-placeholder="workflowPlaceholder" placeholder="Workflow（精确匹配）" autocomplete="off" spellcheck="false">
        <button id="apply-filter" type="button" data-i18n="apply">应用</button>
        <button id="clear-filter" type="button" class="secondary" data-i18n="clear">清除</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-id" data-i18n="taskId">任务 ID</th>
              <th class="col-workflow">Workflow</th>
              <th class="col-status" data-i18n="status">状态</th>
              <th class="col-progress" data-i18n="progress">进度</th>
              <th class="col-retry" data-i18n="retries">重试</th>
              <th class="col-time" data-i18n="createdAt">创建时间</th>
              <th class="col-error" data-i18n="error">错误</th>
            </tr>
          </thead>
          <tbody id="task-rows">
            <tr><td colspan="7" class="empty" data-i18n="loadingTasks">正在加载任务...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="table-footer">
        <span class="muted" data-i18n="listHint">每页最多 25 条，按创建时间倒序</span>
        <div class="pagination">
          <button id="previous-page" type="button" class="secondary" disabled data-i18n="previous">上一页</button>
          <button id="next-page" type="button" class="secondary" disabled data-i18n="next">下一页</button>
        </div>
      </div>
    </section>
  </main>
  <script src="/dashboard.js"></script>
</body>
</html>
